name: KIBSPool
options:
  bundleIdPrefix: de.kibs
  deploymentTarget:
    iOS: "17.0"
targets:
  KIBSPool:
    type: application
    platform: iOS
    sources: [KIBSPool]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kibs.pool
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: KIBS Pool
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.9"
