<title>Repaso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one study column (max 760px) under a slim app bar; tab bar docks to the bottom on phones.
   Signature: azulejo-style tiles that fill in as an item climbs the mastery ladder. */
:root {
  --paper: #F3F5FA;
  --surface: #FFFFFF;
  --sunk: #E9EDF6;
  --ink: #131A2E;
  --muted: #586282;
  --line: #D9DFEC;
  --cobalt: #1F4AA8;
  --cobalt-ink: #FFFFFF;
  --cobalt-soft: #E2E9F9;
  --saffron: #D9930F;
  --saffron-soft: #FCEFD2;
  --ok: #17784E;
  --ok-soft: #DAF1E5;
  --bad: #B93A33;
  --bad-soft: #FAE1DE;
  --tile-empty: #DCE2EF;
  --shadow: 0 1px 2px rgba(19,26,46,.06), 0 6px 20px rgba(19,26,46,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --r-sm: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1222; --surface: #151C32; --sunk: #0F1529; --ink: #E7EBF6; --muted: #98A2C1; --line: #263051;
    --cobalt: #86A6F7; --cobalt-ink: #0D1222; --cobalt-soft: #1C2950; --saffron: #F0B444; --saffron-soft: #3A2C10;
    --ok: #52C892; --ok-soft: #10301F; --bad: #F2847B; --bad-soft: #3B1A19; --tile-empty: #26304F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1222; --surface: #151C32; --sunk: #0F1529; --ink: #E7EBF6; --muted: #98A2C1; --line: #263051;
  --cobalt: #86A6F7; --cobalt-ink: #0D1222; --cobalt-soft: #1C2950; --saffron: #F0B444; --saffron-soft: #3A2C10;
  --ok: #52C892; --ok-soft: #10301F; --bad: #F2847B; --bad-soft: #3B1A19; --tile-empty: #26304F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.6rem, 4.5vw, 2.2rem); font-weight: 750; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; border-radius: 6px; }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* App bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 16px; height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; text-decoration: none; color: var(--ink); margin-right: auto; }
.mark { width: 26px; height: 26px; border-radius: 6px; flex: none;
  background:
    radial-gradient(circle at 50% 50%, var(--saffron) 0 3px, transparent 3.5px),
    conic-gradient(from 45deg, var(--cobalt) 0 25%, var(--cobalt-soft) 0 50%, var(--cobalt) 0 75%, var(--cobalt-soft) 0);
}
.tabs { display: flex; gap: 4px; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: .93rem; border: 0; background: none; cursor: pointer; }
.tab:hover { color: var(--ink); background: var(--sunk); }
.tab[aria-current="page"] { color: var(--cobalt); background: var(--cobalt-soft); }
.tab svg { width: 18px; height: 18px; flex: none; }
.sync { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.cloud i { background: var(--ok); }

main {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
  display: flex; flex-direction: column; gap: 20px;
}

@media (max-width: 640px) {
  .bar .tabs, .bar .sync { display: none; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .dock .tab { flex-direction: column; gap: 2px; font-size: .72rem; padding: 6px 4px; border-radius: 10px; justify-content: center; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  body.in-session .dock { display: none; }
  body.in-session main { padding-bottom: 32px; }
}
@media (min-width: 641px) { .dock { display: none; } }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card.flat { box-shadow: none; }
.card.lift { box-shadow: var(--shadow); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } .grid3 { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .08s ease, background .15s ease; }
.btn:hover { background: var(--sunk); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--cobalt-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { min-height: 54px; font-size: 1.05rem; padding: 12px 26px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: .88rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.go { background: var(--ok-soft); color: var(--ok); }
.pill.steady { background: var(--saffron-soft); color: var(--saffron); }
.pill.hold { background: var(--bad-soft); color: var(--bad); }
.pill.blue { background: var(--cobalt-soft); color: var(--cobalt); }

/* Tile meter: 5 tiles = the mastery ladder */
.tiles { display: inline-grid; grid-auto-flow: column; gap: 3px; }
.tiles i { width: 10px; height: 10px; border-radius: 2.5px; background: var(--tile-empty); display: block; }
.tiles i.on { background: var(--cobalt); }
.tiles i.gold { background: var(--saffron); }
.tiles.lg i { width: 16px; height: 16px; border-radius: 4px; }

.meter { height: 8px; border-radius: 99px; background: var(--tile-empty); overflow: hidden; display: flex; }
.meter b { display: block; height: 100%; background: var(--cobalt); }
.meter b.gold { background: var(--saffron); }

/* Home */
.today { background: var(--cobalt); color: var(--cobalt-ink); border: 0; position: relative; overflow: hidden; }
.today::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; opacity: .18; pointer-events: none;
  background:
    radial-gradient(circle, currentColor 0 7px, transparent 7.5px) 0 0/60px 60px,
    conic-gradient(from 45deg, currentColor 0 25%, transparent 0 50%, currentColor 0 75%, transparent 0) 0 0/60px 60px; }
.today .eyebrow, .today .muted { color: inherit; opacity: .8; }
.today .btn.primary { background: var(--cobalt-ink); color: var(--cobalt); border-color: var(--cobalt-ink); }
.today .btn { border-color: rgba(255,255,255,.35); background: transparent; color: inherit; }
:root[data-theme="dark"] .today .btn:not(.primary) { border-color: rgba(13,18,34,.3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .today .btn:not(.primary) { border-color: rgba(13,18,34,.3); } }
.today .btn:not(.primary):hover { background: rgba(127,127,127,.15); }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-size: 1.6rem; font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: .8rem; color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--saffron-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--saffron) 35%, transparent); }
.banner .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }

.ladder { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; }
.ladder div { background: var(--sunk); border-radius: var(--r-sm); padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; font-size: .8rem; min-width: 0; }
.ladder b { font-size: .85rem; }
@media (max-width: 560px) { .ladder { grid-template-columns: repeat(3, minmax(0,1fr)); } }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .es { font-weight: 700; overflow-wrap: anywhere; }
.li .mean { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }

/* Theme chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; min-width: 150px; flex: 1 1 200px; max-width: 100%; }
.chip:hover { border-color: var(--cobalt); }
.chip[aria-pressed="true"] { border-color: var(--cobalt); background: var(--cobalt-soft); box-shadow: inset 0 0 0 1px var(--cobalt); }
.chip .t { font-weight: 700; overflow-wrap: anywhere; }
.chip .meter { width: 100%; }
.chip .s { font-size: .8rem; color: var(--muted); }

/* Session */
.s-top { display: flex; align-items: center; gap: 12px; }
.s-top .meter { flex: 1; height: 10px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--sunk); color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 5vw, 32px); display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); min-width: 0; }
.qkind { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.prompt { font-family: var(--f-display); font-size: clamp(1.6rem, 6vw, 2.3rem); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.prompt.sm { font-size: clamp(1.2rem, 4.6vw, 1.55rem); font-weight: 650; }
.prompt .gap { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--saffron); height: 1em; vertical-align: baseline; }
.sub { color: var(--muted); }
.speak { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--cobalt); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.speak:hover { background: var(--cobalt-soft); }
.speak svg { width: 20px; height: 20px; }
.speak.huge { width: 84px; height: 84px; }
.speak.huge svg { width: 36px; height: 36px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; min-height: 56px; overflow-wrap: anywhere; }
.opt:hover:not([disabled]) { border-color: var(--cobalt); background: var(--cobalt-soft); }
.opt kbd { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.opt[disabled] { cursor: default; }
.answer { width: 100%; font-size: 1.25rem; padding: 14px 16px; border-radius: var(--r); border: 2px solid var(--line); background: var(--sunk); outline: none; }
.answer:focus { border-color: var(--cobalt); background: var(--surface); }
textarea.answer { min-height: 96px; resize: vertical; font-size: 1.1rem; }
.accents { display: flex; flex-wrap: wrap; gap: 6px; }
.accents button { min-width: 40px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 1.05rem; cursor: pointer; }
.accents button:hover { background: var(--cobalt-soft); }
.hint { font-family: var(--f-mono); letter-spacing: .12em; color: var(--muted); font-size: 1.05rem; overflow-wrap: anywhere; }
.lesson { white-space: pre-wrap; line-height: 1.6; overflow-wrap: anywhere; }
.examples { display: flex; flex-direction: column; gap: 8px; }
.ex { padding: 10px 14px; border-radius: var(--r-sm); background: var(--sunk); min-width: 0; }
.ex b { display: block; overflow-wrap: anywhere; }
.ex span { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }

.fb { border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; border: 1.5px solid transparent; animation: rise .18s ease-out; }
.fb.right { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.fb.almost { background: var(--saffron-soft); border-color: color-mix(in srgb, var(--saffron) 40%, transparent); }
.fb.wrong { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.fb h3 { font-size: 1.2rem; }
.fb.right h3 { color: var(--ok); }
.fb.almost h3 { color: var(--saffron); }
.fb.wrong h3 { color: var(--bad); }
.fb .correct { font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
.fb s { color: var(--muted); }
.fb .ai { white-space: pre-wrap; background: var(--surface); border-radius: var(--r-sm); padding: 12px 14px; font-size: .95rem; border: 1px solid var(--line); }
@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fb { animation: none; } .btn { transition: none; } }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-weight: 700; font-size: .9rem; }
.input, select.input, textarea.input { width: 100%; padding: 11px 13px; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--surface); }
textarea.input { min-height: 160px; resize: vertical; }
.input:focus { border-color: var(--cobalt); outline: none; }
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; cursor: pointer; background: var(--sunk); }
.drop.over { border-color: var(--cobalt); background: var(--cobalt-soft); }
.drop svg { width: 34px; height: 34px; color: var(--cobalt); }
.files { display: flex; flex-direction: column; gap: 6px; }
.file { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--sunk); border-radius: var(--r-sm); font-size: .92rem; min-width: 0; }
.file span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: inline-flex; background: var(--sunk); padding: 4px; border-radius: 999px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.edit-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.edit-row:first-child { border-top: 0; }
.edit-row .input { padding: 8px 10px; }
@media (max-width: 520px) { .edit-row { grid-template-columns: minmax(0,1fr) auto; } .edit-row .input:nth-child(2) { grid-column: 1; grid-row: 2; } }
.progress-log { font-size: .9rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--cobalt); animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
details.how summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::after { content: "+"; font-family: var(--f-mono); color: var(--muted); font-size: 1.2rem; }
details.how[open] summary::after { content: "–"; }
.score-big { font-family: var(--f-display); font-size: 3.4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: .92rem; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
@media (max-width: 640px) { .toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); } body.in-session .toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); } }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r-sm); background: var(--bad-soft); }
.empty { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.splash { display: grid; place-items: center; min-height: 50vh; gap: 12px; color: var(--muted); }
</style>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#home"><span class="mark" aria-hidden="true"></span>Repaso</a>
    <nav class="tabs" aria-label="Main" id="tabs-top"></nav>
    <span class="sync" id="sync"><i></i><span>This browser</span></span>
  </div>
</header>
<main id="view"><div class="splash"><span class="spinner"></span><span>Loading your progress…</span></div></main>
<nav class="dock" aria-label="Main" id="tabs-dock"></nav>
<div class="toast" id="toast" hidden></div>
<input type="file" id="file-input" multiple hidden accept="image/*,.pdf,.docx,.pptx,.txt,.md,.csv,.rtf,.html,.htm">

<script>
"use strict";
/* ============================================================
   Utilities
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);

}

  const out = []; let cur = "";
  for (const para of t.split(/\n{2,}/)) {
    if ((cur + "\n\n" + para).length > size && cur) { out.push(cur); cur = ""; }
    if (para.length > size) { for (let i = 0; i < para.length; i += size) out.push(para.slice(i, i + size)); }
    else cur = cur ? cur + "\n\n" + para : para;
  }
  if (cur.trim()) out.push(cur);

}

  const out = [];

    const l = line.trim(); if (!l) continue;
    const m = l.match(/^(.+?)\s*(?:\t| = | – | — | - | : |;|=)\s*(.+)$/);
    if (m && m[1].trim() && m[2].trim()) out.push({ es: m[1].trim(), meaning: m[2].trim(), alt: [], pos: "other", ex: "", exm: "", note: "", themes: [] });
  }

}

let SES = null;

  if (!pool.length) { toast("Nothing to practise here yet."); return; }
  const p = pacing();
  let queue = [], extra = false;

    const due = pool.filter(c => { const s = st(c); return s && s.d <= t; }).sort((a, b) => st(a).b - st(b).b || st(a).d - st(b).d).slice(0, 18);
    const fresh = pool.filter(c => !st(c)).slice(0, p.newCount);
    const rev = shuffle(due).map(c => c.id);
    for (const c of fresh) { queue.push(...rev.splice(0, 2), c.id); }
    queue.push(...rev);
    if (!queue.length) {
      extra = true;
      queue = shuffle(pool.filter(c => st(c)).sort((a, b) => st(a).b - st(b).b || st(b).l - st(a).l).slice(0, 12)).map(c => c.id);
      if (!queue.length) {
        // Everything here is new but pacing is on hold: allow a tiny taste rather than nothing.
        queue = pool.filter(c => !st(c)).slice(0, 2).map(c => c.id);
      }
    }
  }
  if (!queue.length) { toast("Nothing to practise right now."); return; }
  SES = { queue, total: queue.length, answered: 0, right: 0, info: {}, log: [], held: 0, extra, pace: p, cur: null, done: false, steps: 0, scope: { themes, unitId, ids } };

    if (fresh && SES.answered >= 6 && SES.right / SES.answered < 0.7) { SES.held++; continue; }

  } else {

      ${q.given ? `<p>You wrote <s>${esc(q.given)}</s></p>` : ""}
      <p>Correct answer:</p><p class="correct">${esc(right)} ${c.kind === "vocab" ? `<button class="speak" style="width:32px;height:32px;vertical-align:middle" data-act="say" data-t="${esc(c.v.es)}" aria-label="Play">${ICON.speak}</button>` : ""}</p>
      ${c.kind === "vocab" && q.type !== "recog" ? `<p class="small">${esc(c.v.es)} = ${esc(c.v.meaning)}</p>` : ""}
      ${c.kind === "vocab" && c.v.ex && q.type !== "cloze" ? `<div class="ex"><b>${esc(c.v.ex)}</b><span>${esc(c.v.exm)}</span></div>` : ""}

      <div class="row">${nextBtn}${AI.on && !q.ai ? `<button class="btn" data-act="explain">Explain why</button>` : ""}${typed && q.given ? `<button class="btn ghost" data-act="override">I was right</button>` : ""}</div></div>`;

}

function viewSession() {
  const S_ = SES;

  const q = S_.cur;

  return `
  <div class="s-top"><button class="icon-btn" data-act="quit" aria-label="End session">${ICON.close}</button><div class="meter" role="progressbar" aria-valuenow="${done}" aria-valuemax="${est}"><b style="width:${(done / est) * 100}%"></b></div><span class="num small muted">${done}/${est}</span></div>
  ${S_.flash ? `<div class="banner"><div class="grow"><b>${esc(S_.flash)}</b></div></div>` : ""}
  <section class="qcard">${qBody(q, !!q.fb)}</section>
  ${q.fb ? fbBody(q, "learn") : ""}`;
}
function afterSession() { focusAnswer(); }
function focusAnswer() {
  const q = (SES || TEST)?.cur; if (!q) return;
  if (q.fb) { $("#next-btn")?.focus({ preventScroll: true }); $("#next-btn")?.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  else $("#ans")?.focus({ preventScroll: true });

}
function submit(given, forced) {

  let res;

  else if (q.type === "recog" || q.type === "prod") res = { r: given === correctText(q) ? "right" : "wrong", target: correctText(q) };

function learnApply(q, res) {

  const { before, after } = applyAnswer(c, res.r, { mc: q.type === "recog" || q.type === "prod", cap: info.cap });

}
function learnUndo(q) {

function viewSessionEnd() {

  const up = ids.filter(id => { const ls = L.filter(x => x.id === id); return ls[ls.length - 1].after > ls[0].before; }).length;

  </section>
  ${missed.length ? `<section class="card"><h2>Mistakes to watch</h2><p class="small muted">These come back first next time.</p><div class="list">${missed.map(c => rowFor(c)).join("")}</div></section>` : ""}`;
}

let TEST = null;
function viewTestSetup() {

  return `
  <section class="stack"><button class="btn sm ghost" data-act="test-cancel" style="align-self:flex-start">← Themes</button><h1>Assessment</h1><p class="muted">${esc(ths.map(t => t.name).join(", "))}</p></section>

    <div class="field"><label>Questions</label><div class="seg">${[10, 20, 30].map(n => `<button data-act="tset-n" data-n="${n}" aria-pressed="${T.n === n}">${n}</button>`).join("")}</div></div>
    <label class="row"><input type="checkbox" id="t-studied" data-change="tset-studied" ${T.onlyStudied ? "checked" : ""}> Only material I've studied (${studied} of ${cards.length})</label>

    <div class="row"><button class="btn primary big" data-act="test-start">Start assessment</button></div>
  </section>`;
}
function startTest() {
  const T = UI.tset, keys = UI.sel;
  let pool = allCards().filter(c => inThemes(c, keys));
  if (T.onlyStudied) { const s = pool.filter(c => st(c)); if (s.length >= 4) pool = s; }
  const n = Math.min(T.n, pool.length);
  // Balance: weaker items more likely, every theme represented.
  const weighted = shuffle(pool).sort((a, b) => ((st(a)?.b || 0) - (st(b)?.b || 0)) + (Math.random() - 0.5) * 3);
  const picked = weighted.slice(0, n);
  const names = themeIndex().filter(t => keys.includes(t.key)).map(t => t.name);
  TEST = { keys, names, items: shuffle(picked).map(c => c.id), i: 0, answers: [], cur: null, done: false, writing: null, wIdx: 0, phase: "obj" };
  TEST.cur = buildQ(cardById(TEST.items[0]), "test");
  if (T.writing && AI.on) {
    TEST.writing = { status: "loading", tasks: [], given: [] };
    const vocab = picked.filter(c => c.kind === "vocab").concat(pool.filter(c => c.kind === "vocab")).slice(0, 80).map(c => `${c.v.es} = ${c.v.meaning}`);
    const gram = [...new Set(pool.filter(c => c.kind === "gram").map(c => c.g.title))];
    AI.fn.json(`Create 3 short translation tasks for a beginner Spanish learner. Each is a sentence of 5-12 words in ${lang()} that the student translates into Spanish, using ONLY this vocabulary and grammar. Make them natural and different from each other.
Reply with only a JSON array: [{"prompt": "sentence in ${lang()}", "model": "a correct Spanish translation"}]
Vocabulary:\n${vocab.join("\n")}\n${gram.length ? `Grammar: ${gram.join("; ")}` : ""}`, { modelTier: "default", cache: false })
      .then(r => { if (!TEST || !TEST.writing) return; const tasks = (Array.isArray(r) ? r : []).filter(t => t && t.prompt && t.model).slice(0, 3); TEST.writing.tasks = tasks; TEST.writing.status = tasks.length ? "ready" : "off"; if (TEST.phase === "wait") { TEST.phase = tasks.length ? "write" : "end"; if (!tasks.length) finishTest(); render(); } })
      .catch(e => { if (!TEST || !TEST.writing) return; TEST.writing.status = "off"; TEST.writing.err = AI.errText(e); if (TEST.phase === "wait") finishTest(); });
  }
  render();
}
function testAnswer(q, res) {
  TEST.answers.push({ id: q.card.id, r: res.r, given: q.given, type: q.type });
}
function testNext() {
  TEST.i++;
  if (TEST.i < TEST.items.length) { TEST.cur = buildQ(cardById(TEST.items[TEST.i]), "test"); render(); return; }
  TEST.cur = null;
  if (TEST.writing && TEST.writing.status !== "off") { TEST.phase = TEST.writing.status === "ready" ? "write" : "wait"; render(); return; }
  finishTest();
}
async function finishTest() {
  TEST.phase = "grading"; render();
  const W = TEST.writing;
  if (W && W.tasks.length && W.status === "ready") {
    try {
      const list = W.tasks.map((t, i) => `${i + 1}. Prompt (${lang()}): ${t.prompt}\n   Model answer: ${t.model}\n   Student wrote: ${W.given[i] || "(blank)"}`).join("\n");
      const r = await AI.fn.json(`Grade a beginner Spanish learner's translations. For each task give "score": 2 (meaning and grammar correct; a missing accent is fine), 1 (understandable but with errors) or 0 (wrong or blank). Give "corrected": the student's sentence with errors fixed (or the model answer if blank) and "feedback": one short sentence in ${lang()} naming the main mistake, or praise if correct.
Reply with only a JSON array in task order: [{"score": 2, "corrected": "...", "feedback": "..."}]
\n${list}`, { modelTier: "default", cache: false });
      W.grades = (Array.isArray(r) ? r : []).map(g => ({ score: Math.max(0, Math.min(2, Number(g?.score) || 0)), corrected: String(g?.corrected || ""), feedback: String(g?.feedback || "") }));
    } catch (e) { W.err = AI.errText(e); }

  const per = {};
  for (const a of TEST.answers) {
    const c = cardById(a.id); if (!c) continue;
    const ok = isOk(a.r);
    for (const t of c.themes) { const k = t.trim().toLowerCase(); if (!TEST.keys.includes(k)) continue; (per[k] ||= [0, 0]); per[k][1]++; if (ok) per[k][0]++; }
    const s = st(c), t0 = Date.now();
    if (a.r === "almost") { if (s) s.d = t0; }
    else if (!ok) { const n = s || setSt(c, { b: 0, d: t0, s: 0, c: 0, l: 0, t: t0 }); n.b = Math.min(n.b, 1); n.d = t0; n.l++; n.s++; n.t = t0; }
    else if (!s) setSt(c, { b: 2, d: t0 + INTERVAL[2], s: 1, c: 1, l: 0, t: t0 });
    logAnswer(ok);
    store.mark("prog_" + c.uid);
  }
  const score = TEST.answers.filter(a => isOk(a.r)).length;
  const writing = W && W.grades && W.grades.length ? W.grades.reduce((a, g) => a + g.score, 0) / (W.grades.length * 2) : null;
  S.meta.tests = [...(S.meta.tests || []), { at: Date.now(), keys: TEST.keys, names: TEST.names, score, total: TEST.answers.length, per, writing }].slice(-30);
  store.mark("meta");

}
function viewTest() {
  const T = TEST;

  "train-mistakes"() { const ids = [...new Set(TEST.answers.filter(a => !isOk(a.r)).map(a => a.id))]; TEST = null; startSession({ ids }); },
  "test-done"() { TEST = null; UI.tset = null; go("themes"); },
  "train-unit"(el) { startSession({ unitId: el.dataset.id }); },
  "ask-del"(el) { UI.confirmDel = el.dataset.id; render(); },
  "cancel-del"() { UI.confirmDel = null; render(); },
  "del-unit"(el) { const id = el.dataset.id; delete S.units[id]; delete S.prog[id]; invalidate(); store.mark("unit_" + id, "prog_" + id); UI.confirmDel = null; toast("Unit deleted"); go("library"); },
  edit(el) { UI.editing = el.dataset.id; render(); $("#ed-es")?.focus(); },
  "cancel-edit"() { UI.editing = null; render(); },
  "save-edit"(el) {
    const u = S.units[el.dataset.u], v = u?.vocab.find(x => x.id === el.dataset.id); if (!v) return;
    v.es = $("#ed-es").value.trim() || v.es; v.meaning = $("#ed-mean").value.trim() || v.meaning;
    v.alt = $("#ed-alt").value.split(";").map(s => s.trim()).filter(Boolean);
    UI.editing = null; invalidate(); store.mark("unit_" + u.id); render();
  },
  "del-item"(el) { const u = S.units[el.dataset.u]; if (!u) return; u.vocab = u.vocab.filter(x => x.id !== el.dataset.id); if (S.prog[u.id]) delete S.prog[u.id]["v" + el.dataset.id]; UI.editing = null; invalidate(); store.mark("unit_" + u.id, "prog_" + u.id); render(); },
  "more-ex"(el) { moreExercises(el.dataset.u, el.dataset.g, el); },
  say(el) { TTS.say(el.dataset.t); },
  "add-mode"(el) { addState().mode = el.dataset.m; render(); },
  "pick-files"() { if (!AI.on) return; $("#file-input").click(); },
  "rm-file"(el) { addState().files.splice(+el.dataset.i, 1); render(); },
  process() { processAdd(); },
  "stop-process"() { procCtl?.abort(); },
  "dr-rm-v"(el) { addState().draft.vocab.splice(+el.dataset.i, 1); render(); },
  "dr-rm-g"(el) { addState().draft.grammar.splice(+el.dataset.i, 1); render(); },
  "dr-save"() { saveDraft(); },
  "dr-discard"() { const A = addState(); A.draft = null; render(); },
  // session
  "intro-ok"() {
    const q = SES.cur; q.intro = false;
    if (q.card.kind === "gram") { (S.prog[q.card.uid] ||= {})["gi" + q.card.g.id] = { seen: 1 }; store.mark("prog_" + q.card.uid); }
    render();
  },
  check() { const a = $("#ans"); if (a) submit(a.value); },
  dunno() { submit("", "wrong"); },
  pick(el) { const q = (TEST || SES).cur; submit(q.options[+el.dataset.i]); },
  next() { nextQ(); render(); window.scrollTo(0, 0); },
  explain() { explain(); },
  override() {
    const R = TEST || SES, q = R.cur, c = q.card; if (!q.fb || isOk(q.fb.r)) return;
    if (TEST) { TEST.answers[TEST.answers.length - 1].r = "right"; q.fb = { r: "right", target: q.given }; }
    else { learnUndo(q); learnApply(q, { r: "right", target: q.given }); }
    // Remember this answer as accepted from now on.
    if (c.kind === "vocab" && q.type !== "cloze") c.v.alt = [...new Set([...(c.v.alt || []), q.given.trim()])];
    else if (c.kind === "gram") c.x.accept = [...new Set([...(c.x.accept || []), q.given.trim()])];
    store.mark("unit_" + c.uid);
    toast("Counted as right. That answer is accepted from now on.");
    render();
  },
  ins(el) {
    const a = $("#ans"); if (!a) return;
    const s = a.selectionStart ?? a.value.length, e = a.selectionEnd ?? a.value.length;
    a.value = a.value.slice(0, s) + el.dataset.ch + a.value.slice(e); a.focus(); a.setSelectionRange(s + 1, s + 1);
  },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el, e);
});
document.addEventListener("pointerdown", e => { if (e.target.closest(".accents button")) e.preventDefault(); });
document.addEventListener("keydown", e => {
  const R = TEST || SES; if (!R || !R.cur) return;
  const q = R.cur;
  if (e.key === "Enter" && !e.shiftKey) {
    if (q.fb) { e.preventDefault(); TEST ? testNext() : ACT.next(); }
    else if (q.intro) { e.preventDefault(); ACT["intro-ok"](); }
    else if (e.target.id === "ans") { e.preventDefault(); submit(e.target.value); }
    return;
  }
  if (!q.fb && q.options && /^[1-4]$/.test(e.key) && e.target.tagName !== "INPUT") { const o = q.options[+e.key - 1]; if (o != null) submit(o); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.input) addState()[t.dataset.input] = t.value;
  if (t.dataset.dr) { const d = addState().draft; if (t.dataset.dr === "themes") d.themes = t.value.split(";").map(s => s.trim()).filter(Boolean); else d[t.dataset.dr] = t.value; }
  if (t.dataset.dv) addState().draft.vocab[+t.dataset.dv][t.dataset.f] = t.value;
});
document.addEventListener("change", e => {
  const t = e.target, k = t.dataset.change; if (!k) return;
  const set = S.meta.settings;
  if (k === "set-lang") set.lang = t.value;
  if (k === "set-goal") set.goal = +t.value;
  if (k === "set-audio") set.audio = t.checked;
  if (k === "tset-studied") UI.tset.onlyStudied = t.checked;
  if (k === "tset-writing") UI.tset.writing = t.checked;
  if (k.startsWith("set-")) { store.mark("meta"); toast("Saved"); }
});
$("#file-input").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
window.addEventListener("hashchange", () => { UI.testSetup = false; route(); });

/* ============================================================
   Boot
   ============================================================ */
(async function boot() {
  TTS.init();
  await Promise.all([store.init(), AI.init()]);
  if (!Object.keys(S.units).length && !S.meta.seeded) {
    S.units.example = addIds(exampleUnit()); S.meta.seeded = true;
    store.mark("unit_example", "meta");
  }
  invalidate();
  route();
})();
</script>
